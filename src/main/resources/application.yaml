spring:
  jackson:
    deserialization:
      accept-float-as-int: false
    datatype:
      enum:
        fail-on-numbers-for-enums: true
  application:
    name: nutripick
  mail:
    properties:
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

nutripick:
  jwt:
    secret: ${NUTRIPICK_JWT_SECRET}

---
spring:
  config:
    activate:
      on-profile: local

  jpa:
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      platform: postgresql
